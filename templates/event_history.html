
<!DOCTYPE html>
<html>
<head>
    <title>Gallery Event History</title>
</head>
<body>
    <h1>Gallery Event History</h1>

    {% if events %}
        <ul>
            {% for event in events %}
                <li>{{ event[4] }} - Room: {{ event[3] }} - Date: {{ event[2] }} - Time: {{ event[1] }}</li>
            {% endfor %}
        </ul>
    {% else %}
        <p>No gallery events recorded.</p>
    {% endif %}

    <p><a href="{{ url_for('home') }}">Back to Home</a></p>
</body>
</html>
